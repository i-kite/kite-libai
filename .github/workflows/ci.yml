name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Unit tests (JDK 11)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Cache cleanup runs an extra Gradle invocation with the runner's preinstalled
          # Gradle (9.x), which this Gradle 7.6 / Boot 2.5 build cannot be run under.
          # It only prunes stale cache entries, so disabling it costs nothing here.
          cache-cleanup: never

      # No --no-daemon here: setup-gradle manages the daemon and its caches for us.
      - name: Run tests
        run: ./gradlew test

      # Annotates failing tests inline on the commit. Never let the reporter itself fail the job.
      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        continue-on-error: true
        with:
          report_paths: build/test-results/test/TEST-*.xml
          check_name: Test results

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

  image:
    name: Build container image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pull requests from forks cannot access GHCR credentials, so only log in when pushing.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 冒烟测试必须连真实 MySQL:应用在没有数据库时也能启动,/api/hello 照样返回 200,
      # 只 curl 这一个端点会让"数据库连不上"这类故障完全逃过检查。
      # 这一步同时验证了 db/mysql/*.sql 能在真实 MySQL 上执行。
      - name: Smoke test the image against a real MySQL
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n 1)"

          docker network create kite-net
          docker run -d --name smoke-mysql --network kite-net \
            -e MYSQL_ROOT_PASSWORD=root123 -e MYSQL_DATABASE=kite_libai \
            mysql:8.0 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

          echo "waiting for mysql..."
          for i in $(seq 1 60); do
            if docker exec smoke-mysql mysqladmin ping -uroot -proot123 --silent 2>/dev/null; then
              echo "mysql ready after ${i} attempts"; break
            fi
            sleep 2
          done

          docker exec -i smoke-mysql mysql -uroot -proot123 kite_libai \
            < src/main/resources/db/mysql/schema.sql
          docker exec -i smoke-mysql mysql -uroot -proot123 kite_libai \
            < src/main/resources/db/mysql/data.sql

          docker run -d --name smoke --network kite-net -p 8080:8080 \
            -e MYSQL_HOST=smoke-mysql \
            -e MYSQL_DATABASE=kite_libai \
            -e MYSQL_USERNAME=root \
            -e MYSQL_PASSWORD=root123 \
            "$IMAGE"

          echo "waiting for application..."
          for i in $(seq 1 45); do
            if curl -fsS -m 5 http://localhost:8080/api/hello > /tmp/hello.json 2>/dev/null; then
              break
            fi
            sleep 2
          done

          echo "--- GET /api/hello ---"
          cat /tmp/hello.json
          grep -q 'Hello, World!' /tmp/hello.json

          echo "--- GET /api/system/dept/tree ---"
          curl -fsS -m 15 http://localhost:8080/api/system/dept/tree > /tmp/tree.json
          cat /tmp/tree.json
          # 校验数据库链路真的通了,并且中文没有乱码
          grep -q '总公司' /tmp/tree.json

          echo "--- GET /api/system/permission/1 ---"
          curl -fsS -m 15 http://localhost:8080/api/system/permission/1 > /tmp/perm.json
          cat /tmp/perm.json
          grep -q '\*:\*:\*' /tmp/perm.json

          echo "smoke test passed"

      - name: Dump smoke test logs on failure
        if: failure()
        run: |
          docker logs smoke 2>&1 | tail -100 || true
          docker logs smoke-mysql 2>&1 | tail -30 || true

      - name: Clean up smoke test containers
        if: always()
        run: |
          docker rm -f smoke smoke-mysql || true
          docker network rm kite-net || true
