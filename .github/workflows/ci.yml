name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Unit tests (JDK 11)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No --no-daemon here: setup-gradle manages the daemon and its caches for us.
      - name: Run tests
        run: ./gradlew test

      # Annotates failing tests inline on the commit. Never let the reporter itself fail the job.
      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        continue-on-error: true
        with:
          report_paths: build/test-results/test/TEST-*.xml
          check_name: Test results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

  image:
    name: Build container image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests from forks cannot access GHCR credentials, so only log in when pushing.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n 1)"
          docker run -d --name smoke -p 8080:8080 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/hello > /tmp/out.json; then
              echo "response: $(cat /tmp/out.json)"
              grep -q 'Hello, World!' /tmp/out.json && exit 0
              echo "unexpected payload" && exit 1
            fi
            sleep 2
          done
          echo "service did not become healthy" >&2
          docker logs smoke >&2
          exit 1
