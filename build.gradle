plugins {
    id 'java'
    id 'org.springframework.boot' version '2.5.15'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group = 'com.kite'
version = '0.0.1-SNAPSHOT'
description = '权限管理系统后端服务'

ext {
    mybatisPlusVersion = '3.5.3.1'
    jjwtVersion = '0.12.6'
    bcryptVersion = '0.10.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 持久层:MyBatis-Plus(自带 mybatis-spring-boot 自动配置)
    implementation "com.baomidou:mybatis-plus-boot-starter:${mybatisPlusVersion}"

    // 鉴权自行实现(注解 + 拦截器),不引入 Spring Security

    // 双 token(accessToken / refreshToken)的签发与校验
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // 独立的 BCrypt 实现,编译期只带 at.favre.lib:bytes,不依赖 Spring Security
    implementation "at.favre.lib:bcrypt:${bcryptVersion}"

    runtimeOnly 'mysql:mysql-connector-java'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 测试用内存库,以 MySQL 兼容模式运行,避免单元测试依赖真实 MySQL 实例
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Resolves the full compile + runtime dependency graph without compiling any source.
// The Dockerfile runs this before copying src/, so editing a .java file no longer
// invalidates the layer that holds the downloaded dependencies.
tasks.register('resolveDependencies') {
    description = 'Downloads every dependency needed to compile and package the application.'
    group = 'build setup'
    doLast {
        configurations.compileClasspath.resolve()
        configurations.runtimeClasspath.resolve()
    }
}
